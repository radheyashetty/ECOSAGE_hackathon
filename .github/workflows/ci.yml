name: EcoSage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-html
      
      - name: Lint with ruff
        run: ruff check ecosage/ tests/ ui/
      
      - name: Run complete test suite with HTML report
        run: pytest tests/ -v --junitxml=test-results.xml --html=report.html --self-contained-html
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload Verifiable Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecosage-verifiable-test-report
          path: |
            report.html
            test-results.xml
          retention-days: 30
